# Netlify 部署配置（免费套餐即可）
#
# 说明：
#   * Next.js 由官方 OpenNext 适配器 @netlify/plugin-nextjs 接管：它把 SSR / API 路由 /
#     Server Actions 打包成 Netlify Functions（Node 运行时，因此服务端 sharp 可正常使用），
#     并把 public/ 与 .next/static 正确挂到发布目录上。
#   * ⚠️ 必须显式声明 [[plugins]]：实测首次部署时 Netlify 的「框架自动识别」没有生效，
#     结果它把 .next 当成普通静态目录直接发布 —— 根目录没有 index.html，于是
#     首页 / 静态文件 / 全部 API 都返回 404（是 Netlify 的 Page not found，不是应用报错）。
#     显式声明后适配器一定会运行，不再依赖自动识别。
#   * publish 必须指向 .next（这是适配器约定的目录，不是 out）。
#   * NODE_VERSION 显式固定为 22：@supabase/supabase-js 2.x 要求 Node >= 22，
#     sharp 0.35 要求 >= 20.9，避免构建镜像默认到低版本。
#   * pnpm 由 Netlify 依据 pnpm-lock.yaml 自动识别并提供（无需额外配置）。
#
# ⚠️ 不要把环境变量写进这个文件 —— 请在 Netlify 控制台
#    Project configuration → Environment variables 里配置。

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # 构建期就需要 NEXT_PUBLIC_* （Next 会把它们内联进前端产物），
  # 所以环境变量必须在部署前就配置好。

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
